name: Backend API CI

on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      

      - name: Build
        run: go build -v ./...

      - name: Run tests
        env:
         DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
        run: go test ./internal/controllers