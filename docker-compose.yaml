version: '3.8'

services:
  frontend:
    build:
      context: ./client/editorzzz-adminc
    ports:
      - "4000:3000"
    networks:
      - editorzzz-secure
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "1001:1001"
    env_file:
      - ./backend/.env
    networks:
      - editorzzz-secure

networks:
  editorzzz-secure:
    driver: bridge