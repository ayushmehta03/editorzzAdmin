apiVersion: apps/v1
kind: Deployment
metadata:
  name: editorzzz
  labels:
    app: editorzzz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: editorzzz
  template:
    metadata:
      labels:
        app: editorzzz
    spec:
      containers:
      - name: editorzzz-backend
        image: ayushmehta1/editorzzz-adminb:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1001
        envFrom:
        - secretRef:
            name: editorzzz-env

      - name: editorzzz-client
        image: ayushmehta1/editorzzz-adminc:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000