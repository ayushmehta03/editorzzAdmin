name: Build & Push Docker Images

on:
  workflow_run:
    workflows:
      - SonarQube SAST
    types:
      - completed

jobs:
  docker:
    # Only run Docker when SonarQube workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that passed SonarQube
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in Auth
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ayushmehta1/editorzzz-adminb:1.0.1
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./client/editorzzz-adminc
          file: ./client/editorzzz-adminc/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ayushmehta1/editorzzz-adminc:1.0.1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend