name: SonarCloud SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go
        run: |
          go version
          which go
          go env GOROOT
          go env GOTOOLDIR

      - name: Download Go dependencies
        working-directory: ./backend
        run: |
          go mod download

      - name: Run Go tests with coverage
        working-directory: ./backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage file
        working-directory: ./backend
        run: |
          test -f coverage.out
          echo "Coverage file generated successfully"
          head -5 coverage.out

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ayushmehta03_editorzzAdmin
            -Dsonar.organization=ayushmehta03
            -Dsonar.sources=backend
            -Dsonar.go.coverage.reportPaths=backend/coverage.out
            -Dsonar.exclusions=client/**,**/vendor/**,**/build-wrapper-dump.json